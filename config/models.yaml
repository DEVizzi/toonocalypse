# Model names and limits. Every entry must be commercial-safe and listed in LICENSES.md.

gemini:
  api_version: "v1beta"
  discovery_cache_hours: 24
  # Preference order; models.list() at startup filters to the ones that exist.
  # 404 -> skipped for the rest of the run; 429 -> retryDelay recorded in state/quota.json.
  text: ["gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.5-flash-lite"]
  vision: ["gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.5-flash-lite"]

kaggle:
  kernel_slug: "toonocalypse-art"     # full id = <KAGGLE_USERNAME>/toonocalypse-art
  weights_dataset_slug: "toonocalypse-weights"
  weekly_gpu_hours: 30                # verified against Kaggle docs at implementation time
  stop_at_pct: 85

image:
  base: "stabilityai/stable-diffusion-xl-base-1.0"
  width: 768
  height: 1344
  steps: 28
  scheduler: "dpmpp_2m_karras"
  guidance: 6.5
  ip_adapter:
    repo: "h94/IP-Adapter"
    weight: "sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors"
    image_encoder: "models/image_encoder"
    scale: 0.45
    repair_scale: 0.5
  upscaler: "RealESRGAN_x2plus"
  upscaler_url: "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth"
  est_gpu_seconds_per_image: 40       # used for the weekly-quota check before every push
  kernel_time_budget_hours: 9         # stop generating early inside Kaggle's 12h session limit
  candidates:
    portrait: 16
    portrait_keep: 4
    panel: 4
    panel_keep: 2
  prefilter:
    clip_model: "openai/clip-vit-large-patch14"
    dino_model: "facebook/dinov2-base"
    dino_min_similarity: 0.55
    reject_if_text: true

tts:
  primary: "kokoro"
  fallback: "piper"
  piper_voice: null              # set only to a voice whose model card permits commercial use (LICENSES.md)
  voices:                        # Kokoro-82M voice ids; 'a' = American, 'b' = British English
    narrator: "bm_george"
    male_child: "am_puck"
    male_young: "am_adam"
    male_adult: "am_michael"
    male_elder: "bm_lewis"
    female_child: "af_sky"
    female_young: "af_bella"
    female_adult: "af_heart"
    female_elder: "bf_emma"
    female_alt: "af_nicole"
    male_alt: "am_eric"
