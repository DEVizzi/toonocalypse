# Toon Toon Castle — every behaviour-changing value lives here (§22.3).
series_name: "Toon Toon Castle"
made_for_kids: false            # README: true = YouTube comments off (vote loop uses Instagram only), no bell, limited ads
youtube_privacy_status: "private"   # private | unlisted | public (overridden by YOUTUBE_PRIVACY_STATUS env)
youtube_category_id: "20"       # Gaming
timezone: "Asia/Kolkata"
slots: ["12:30", "19:30"]
min_hours_between_posts: 3

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: "veryfast"
  duration_min_s: 25
  duration_max_s: 50

# §4 master episode timeline (single source of truth; read through src/config.TIMELINE)
timeline:
  cold_open_s: 0.5
  flash_forward_s: 1.0
  flash_forward_chance: 0.30
  gameplay_target_min_s: 26
  gameplay_target_max_s: 36
  forced_resolution_s: 36
  hard_stop_s: 38
  escalation: [[0, 1.0, ""], [12, 1.3, "SPEED UP!"], [22, 1.65, "OVERTIME CHAOS!"]]
  replay_s: 2.2
  replay_speed: 0.4
  replay_source_s: 0.9
  replay_zoom: 1.35
  winner_card_s: 2.5
  loop_tail_s: 0.4
  two_stage_chance: 0.30
  two_stage_qualifier_s: 14
  two_stage_survivors: 6
  two_stage_sting_s: 0.6
  two_stage_final_s: 16

# §8 safe zones (y ranges, 1080x1920)
layout:
  top_sky: [0, 140]
  header: [140, 330]
  viewport: [330, 1650]
  action_bias: [400, 1250]
  captions: {y: [1240, 1440], x: [100, 940]}
  bottom_band: [1650, 1920]
  right_ui_column: {x_min: 960, y: [900, 1650]}

cast:
  spotlight_heroes: 6
  extras_range: [24, 30]
  mega_heroes: 10
  mega_extras: 32
  extra_radius: 14

physics:
  substeps: 6
  gravity_side: 980
  topdown_damping: 0.88
  velocity_clamp: 1400
  stun_threshold: 900
  stun_s: 0.55
  unstick_window_s: 1.5
  unstick_min_px: 18
  bevel_radius: 8
  segment_radius: 6
  speed_centre: 255        # effective max speed = centre + (stat - centre) * spread (keeps §9.2 ordering)
  speed_spread: 0.45
  pacing:                   # schedule-driven arena pressure (see Sim._pacing)
    schedule_end_s: 33
    schedule_power: 1.6
    pressure_gain: 4.0
    pressure_max: 3.0
    chase_min: 0.6
    chase_max: 1.8
    shrink_start_s: 6
    shrink_rate: 0.011
    edge_k_min: 0.30
  extras:                   # extras are fodder: they freeze in cartoon panic at drops and hazards
    panic_per_s: 2.5
    panic_s: [0.3, 0.8]
  course_length_scale: 1.45  # SIDE section counts multiplier
  course_ramp: [0.55, 1.3]  # SIDE gap-width multiplier from the start to the finish of a course

mode_mix: {SIDE_VIEW: 0.65, TOP_DOWN: 0.35}

scorer:
  seeds_per_batch: 8
  max_seeds: 16
  min_score: 30

season:
  length_days: 90
  points: {first: 10, second: 6, third: 4, ko: 1, sunday_multiplier: 2}
  bitter_rival_threshold: 3

fan_buff: false

audio:
  narration_db: 0
  sfx_db: -7
  music_db: -22
  loudness_lufs: -14
  sfx_cap_per_s: 12
