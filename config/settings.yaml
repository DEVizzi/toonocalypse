# ToonToonCastle — every behaviour-changing value lives here (§22.3).
series_name: "ToonToonCastle"
channel_handle: "@ToonToonCastle"
made_for_kids: false            # YouTube Shorts & Instagram Reels: false enables comments & full reach
youtube_privacy_status: "private"   # private | unlisted | public (overridden by YOUTUBE_PRIVACY_STATUS env)
youtube_category_id: "20"       # Gaming
timezone: "Asia/Kolkata"
slots: ["12:30", "19:30"]
min_hours_between_posts: 3

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: "veryfast"
  duration_min_s: 20
  duration_max_s: 50

# §4 master episode timeline (single source of truth; read through src/config.TIMELINE)
# OWNER OVERRIDES 2026-11-20: tighter pacing for Shorts/Reels retention. v3.0 ball pass -> total video 20-28 s:
# 0.8 s cold-open teaser + gameplay 16-24 s + 1.5 s replay + 1.6 s card + 0.4 s loop tail.
timeline:
  cold_open_s: 1.2              # v5.0: <= 1.5s instant-action cold open ("PICK YOUR FIGHTER!" / "WHO SURVIVES?")
  flash_forward_s: 1.0
  flash_forward_chance: 0.0
  gameplay_target_min_s: 18
  gameplay_target_max_s: 25
  forced_resolution_s: 25
  hard_stop_s: 26
  escalation: [[0, 1.0, ""], [8, 1.3, "SPEED UP!"], [17, 1.65, "OVERTIME CHAOS!"]]
  replay_s: 1.5
  replay_speed: 0.3
  replay_source_s: 0.45
  replay_zoom: 1.42
  winner_card_s: 2.75
  loop_tail_s: 0.0
  two_stage_chance: 0.0
  two_stage_qualifier_s: 9
  two_stage_survivors: 6
  two_stage_sting_s: 0.6
  two_stage_final_s: 10

# §8 safe zones (y ranges, 1080x1920 — bottom 15% y >= 1632 strictly clear of all critical UI)
layout:
  top_sky: [0, 0]
  header: [0, 240]
  viewport: [240, 1632]
  action_bias: [700, 1200]
  captions: {y: [1420, 1560], x: [60, 1020]}
  bottom_band: [1632, 1920]
  right_ui_column: {x_min: 960, y: [900, 1580]}

cast:
  spotlight_heroes: 10          # v3.0: all 10 heroes every episode
  extras_range: [3, 5]          # crash dummies
  mega_heroes: 10
  mega_extras: 5
  extra_radius: 20

physics:
  substeps: 6
  gravity_side: 980
  topdown_damping: 0.88
  velocity_clamp: 1450
  angular_clamp: 24          # rad/s
  stun_range: [0.35, 0.75]   # propulsion cut after a knock, scaled by impulse
  fall_kill_depth: 240       # SIDE: this far below the course floor profile = fell off
  top_fall_s: 0.45
  victory_delay_s: 0.55      # TOP: wait after 2nd-to-last falls so zero losers remain on disc
  disc:                      # v3.3 Rotating Disc true last-player-standing endgame
    min_radius_px: 44        # shrink until barely 1 hero fits
    shrink_end_s: 25         # combined radius reaches min_radius around here
    hard_stop_s: 38          # never resolve while > 1 alive before this cap
    final_push_s: 10         # centrifugal drift + spin ramp over the final seconds
    spin_ramp: 0.7           # +70% spin at full ramp
    centrifugal: 1050        # outward accel (px/s^2) at the rim at full ramp
  wall_lag_px: 850           # v3.3 SIDE: elimination wall never lags more than this behind the action cluster
  flight_vy_min: -680        # v3.3 Boing/Floater peak upward speed cap
  flight_ceiling_px: 360     # v3.3 Boing/Floater soft altitude cap above the local track
  floater_air_drag: 0.42     # per second while airborne (v3.2: floaty long arcs)
  dummy_propulsion: 0.72
  top_dummy_propulsion: 0.60 # v3.2: weaker center-recovery in TOP_DOWN so dummies exit before Final 3
  juggernaut_propulsion: 0.65 # v3.2: lumbering self-propulsion, relies on downhill mass momentum
  juggernaut_flat_damping: 5.2 # v3.2: flat-ground rotational resistance for iron cube corners
  glitch_period_s: 2.0
  magneto_downforce: 0.3
  magneto_tug: 160
  overtime: {survivors: 3, hazard_mult: 2.0, shrink_mult: 4.0}
  stun_threshold: 650
  stun_s: 0.55
  unstick_window_s: 1.5
  unstick_min_px: 45
  bevel_radius: 8
  segment_radius: 6
  speed_centre: 255        # effective max speed = centre + (stat - centre) * spread (keeps §9.2 ordering)
  speed_spread: 0.45
  pacing:                   # schedule-driven arena pressure (see Sim._pacing)
    schedule_end_s: 20
    schedule_power: 1.3
    pressure_gain: 4.0
    pressure_max: 3.0
    left_behind_views: 2.3    # LEFT BEHIND distance behind the camera centre, in 1080-px view widths
    chase_finish_s: 32        # SIDE collapsing floor would reach the finish line at this gameplay time
    chase_min: 0.4
    chase_max: 1.15
    shrink_start_s: 3
    shrink_rate: 0.018
    edge_k_min: 0.42
  extras:                   # extras are fodder: they freeze in cartoon panic at drops and hazards
    panic_per_s: 3.5
    panic_s: [0.3, 0.8]
    jump_k: 0.9              # bots jump lower than heroes
    mill_radius: 1.18         # TOP: bots mill about this far out (x spawn radius), near the rim
    goal_sight_px: 180       # TOP: extras ignore goal targets farther than this
  juggernaut_momentum: 0.55  # SIDE: Juggernaut's top speed builds while rolling downhill at speed
  floater_air_control: 0.55  # SIDE: gentle forward air drift while gliding
  hazard_escalation_exp: 1.5  # hazards scale with speed_mult ** exp (overtime 1.65x -> 2.5x hazards)
  goal_timers:                # survive/collect timers and zone hold, sized to the gameplay window
    survive_s: [19.5, 22.5]
    collect_s: [19.5, 22.5]
    zone_hold_s: 4.5
    bomb_pop_s: [3.6, 2.6]    # normal (first pop <= 4s!), overtime
  top_quake: {t: 1.35, dv: 430, stun_s: 0.38}  # TOP opening lever: outward floor buck -> guaranteed KO <= 4s
  hero_edge_margin: 1.35     # TOP: heroes keep this much more distance from drops
  shove_top: 240             # TOP shove impulse per unit mass (lunger mass capped at 3x the target's)
  course_length_scale: 1.9   # SIDE section counts multiplier (preserves layout fingerprint determinism)
  course_ramp: [0.6, 1.1]  # SIDE gap-width multiplier from the start to the finish of a course

render:
  side_zoom: 1.0          # default SIDE_VIEW zoom
  side_zoom_range: [0.86, 1.60]   # v5.0: general-play floor 0.86x; Final-3 zooms into 1.40x-1.60x
  duel_min_zoom: 0.76     # v4.3: final 2-3 moderately spaced (650-1100 px) may pull back to 0.76x, never below
  cam_max_vx: 760         # v5.0 smooth-damp max pan velocity (px/s, world)
  cam_max_vy: 560
  cam_switch_hysteresis_s: 0.55   # v5.0: snappy leader follow without jitter
  cluster_window_px: 750  # v3.3 camera frames the densest 4-6 heroes inside this window
  leader_lock_px: 650     # lock onto #1 within this distance of the finish (or <= 3 survivors)
  top_zoom: 0.94          # multiplier on the fit-to-arena zoom in TOP_DOWN (cold open fits with margin)
  final3_zoom: 1.50       # v5.0: automated Final-3 dynamic zoom target (1.4x-1.6x) across all modes
  top_zoom_max: 2.05      # v3.3 TOP: zoom = initial_radius / current_radius, capped 2.05x

mode_mix: {SIDE_VIEW: 0.65, TOP_DOWN: 0.35}
v6_from_day: 2            # first season day that draws from the 21 v6 league arenas (earlier days replay the legacy pool)

scorer:
  seeds_per_batch: 8
  max_seeds: 16
  min_score: 30
  dummy_win_penalty: -1000
  reject_penalty: -200
  first_blood_s: 3.8
  dead_stretch_s: 5.0
  major_impulse: 700

season:
  length_days: 90
  points: {first: 10, second: 6, third: 4, ko: 1, sunday_multiplier: 2}
  bitter_rival_threshold: 3
  finale_cross_promo_enabled: true
  finale_cross_promo_races: [28, 29, 30]

fan_buff: false

audio:
  sample_rate: 44100
  narration_db: 0
  sfx_db: -7
  sfx_duck_db: -7         # v3.4: attenuate loud SFX by -7 dB during active narration
  music_db: -18           # v3.4: upbeat game-show funk BGM at -18 dB
  duck_db: -6             # v3.4: ducks smoothly from -18 dB to -24 dB when narration RMS > 0.02
  loudness_lufs: -14
  sfx_cap_per_s: 12
  voice: "en-AU-WilliamNeural"   # v4.2: cheeky Ozzy-Man sports-chaos caster (per-beat prosody in tts.PROSODY)
  voice_fallback: "en-GB-RyanNeural"
  voice_rate: "+16%"
  voice_pitch: "+2Hz"
  gemini_model: "gemini-2.5-flash"
  gemini_models: ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-3-flash-preview", "gemini-2.0-flash", "gemini-2.0-flash-lite"]
  bpm: 126
