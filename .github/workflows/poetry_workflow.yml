name: Toonocalyse workflow

on:
  schedule:
    # Monday to Sunday — 9:40 AM IST and 7:10 PM IST


  workflow_dispatch:

# 🔒 Required: Give write access to GITHUB_TOKEN
permissions:
  contents: write

jobs:
  crazybot:
    runs-on: ubuntu-latest
    env:
      
      IG_ACCESS_TOKEN:           ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID:                ${{ secrets.IG_USER_ID }}
      GOOGLE_API_KEY:            ${{ secrets.GOOGLE_API_KEY }}
      YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TWITTER_API_KEY:           ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET:        ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_BEARER_TOKEN:      ${{ secrets.TWITTER_BEARER_TOKEN }}
      TWITTER_ACCESS_TOKEN:      ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}    

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt update && sudo apt install -y ffmpeg

      - name: Run Crazy Bot
        run: python Crazy_bot.py

      - name: Commit updated history_story.txt
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main
          git add history_story.txt
          git diff --cached --quiet || git commit -m "🤖 Update story history [bot]"
          git push
        env:
          # This is required to push from a GitHub Action
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
