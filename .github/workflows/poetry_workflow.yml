name: Toonocalyse workflow

on:
  schedule:
    # Monday
# - cron: "30 1 * * 1"  # 7:00 AM IST
# - cron: "30 7 * * 1"  # 1:00 PM IST
# - cron: "30 14 * * 1" # 8:00 PM IST

# Tuesday
# - cron: "30 2 * * 2"  # 8:00 AM IST
# - cron: "30 8 * * 2"  # 2:00 PM IST
# - cron: "30 15 * * 2" # 9:00 PM IST

# Wednesday
# - cron: "30 1 * * 3"  # 7:00 AM IST
# - cron: "30 7 * * 3"  # 1:00 PM IST
# - cron: "30 14 * * 3" # 8:00 PM IST

# Thursday
# - cron: "30 2 * * 4"  # 8:00 AM IST
# - cron: "30 8 * * 4"  # 2:00 PM IST
# - cron: "30 15 * * 4" # 9:00 PM IST

# Friday
# - cron: "30 1 * * 5"  # 7:00 AM IST
# - cron: "30 7 * * 5"  # 1:00 PM IST
# - cron: "30 14 * * 5" # 8:00 PM IST

# Saturday
# - cron: "30 3 * * 6"  # 9:00 AM IST
# - cron: "30 9 * * 6"  # 3:00 PM IST
# - cron: "30 16 * * 6" # 10:00 PM IST

# Sunday
# - cron: "30 2 * * 0"  # 8:00 AM IST
# - cron: "30 8 * * 0"  # 2:00 PM IST
# - cron: "30 15 * * 0" # 9:00 PM IST

  workflow_dispatch:


# 🔒 Required: Give write access to GITHUB_TOKEN
permissions:
  contents: write

jobs:
  crazybot:
    runs-on: ubuntu-latest
    env:
      
      IG_ACCESS_TOKEN:           ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID:                ${{ secrets.IG_USER_ID }}
      GOOGLE_API_KEY:            ${{ secrets.GOOGLE_API_KEY }}
      YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TWITTER_API_KEY:           ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET:        ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_BEARER_TOKEN:      ${{ secrets.TWITTER_BEARER_TOKEN }}
      TWITTER_ACCESS_TOKEN:      ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}    

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt update && sudo apt install -y ffmpeg

      - name: Run Crazy Bot
        run: python Crazy_bot.py

      - name: Commit updated history_story.txt
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main
          git add history_story.txt
          git diff --cached --quiet || git commit -m "🤖 Update story history [bot]"
          git push
        env:
          # This is required to push from a GitHub Action
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
