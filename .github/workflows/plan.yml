name: Plan Story

# Manual only until the dry run is approved; the 6h schedule is added in Phase 6.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed story title (blank = next unused seed / new story)"
        required: false
        default: ""

concurrency:
  group: plan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Plan + script + judge
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SEED: ${{ inputs.seed }}
        run: |
          if [ -n "$SEED" ]; then python -m src.story plan --seed "$SEED"; else python -m src.story plan; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-sample
          path: story_sample.json
          if-no-files-found: ignore
      - name: Push Kaggle PORTRAITS job for a scripted story
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install -q "kaggle>=1.7" six
          mkdir -p ~/.kaggle
          python3 -c 'import json,os; json.dump({"username":os.environ["KAGGLE_USERNAME"],"key":os.environ["KAGGLE_API_TOKEN"]}, open(os.path.expanduser("~/.kaggle/kaggle.json"),"w"))'
          chmod 600 ~/.kaggle/kaggle.json
          python -m src.kaggle_jobs start
      - name: Remove Kaggle credentials
        if: always()
        run: rm -rf ~/.kaggle
      - name: Commit state
        if: always()
        run: |
          git config user.name "toonocalypse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/story_bible.json state/quota.json
          git diff --cached --quiet || git commit -m "chore(state): story plan update"
          git pull --rebase -q && git push -q
