name: Refresh Tokens

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false

concurrency:
  group: tokens
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Refresh Instagram long-lived token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_PAT_SECRETS: ${{ secrets.GH_PAT_SECRETS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then FLAG="--force"; fi
          python3 -m src.cli tokens-refresh $FLAG
      - name: Commit token state
        run: |
          git config user.name "toonocalypse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/tokens.json
          git diff --cached --quiet || git commit -m "chore: update token metadata"
          git push
