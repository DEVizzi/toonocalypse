name: Refresh Tokens

on:
  # schedule:
  #   - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Refresh Instagram long-lived token if < 20 days left
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m src.tokens refresh
      - name: Commit state
        run: |
          git config user.name "toonocalypse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/tokens.json
          git diff --cached --quiet || git commit -m "chore(state): token status"
          git pull --rebase -q && git push -q
