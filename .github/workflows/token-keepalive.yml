name: YouTube OAuth Keep-Alive

# Exercises YOUTUBE_REFRESH_TOKEN weekly so it never ages out from inactivity, and opens a GitHub Issue
# immediately if Google revokes it — days before a daily upload would fail.
on:
  schedule:
    - cron: "17 6 * * 1"        # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_EXPECTED_CHANNEL_ID: UCDFPguMeI582rA374rLa7ow   # @ToonToonCastle (public channel id)
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.5
      - name: Refresh + verify YouTube access (fails closed)
        run: python -m src.publish.oauth
      - name: Open GitHub Issue alert on OAuth failure
        if: failure()
        run: |
          python -c 'from src.publish.alerts import open_alert_issue; open_alert_issue("[ToonToonCastle Alert] YouTube OAuth Keep-Alive Failed", "Weekly YOUTUBE_REFRESH_TOKEN verification failed. Re-run OAuth consent and update YOUTUBE_REFRESH_TOKEN.")'
