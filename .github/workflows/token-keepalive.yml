name: OAuth Token Keep-Alive

# Exercises YOUTUBE_REFRESH_TOKEN on a schedule so it never ages out from inactivity, and fails LOUDLY
# (GitHub emails the owner) if Google revokes it — long before a daily upload would break.
# Runs weekly, i.e. well inside the 60-day refresh window (and inside the 7-day expiry that applies if the
# Google Cloud OAuth consent screen is still in "Testing" status).
on:
  schedule:
    - cron: "17 6 * * 1"        # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.34.2
      - name: Refresh + verify YouTube access (fails closed)
        run: python -m src.publish.oauth
