name: Preview

# Manual single-video dry-run preview (never scheduled; uploads auto-expiring workflow artifact).
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        default: "python run_daily_episode.py --dry-run --brand-stills --out output/dry_run_s1_e1.mp4"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg (IPv4 fast path + retries)
        timeout-minutes: 4
        run: |
          if which ffmpeg && which ffprobe; then ffmpeg -version | head -1; exit 0; fi
          APT_OPTS="-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for i in 1 2 3; do
            sudo apt-get $APT_OPTS update -q && sudo apt-get $APT_OPTS install -y -q --no-install-recommends ffmpeg && break
            echo "apt attempt $i failed; retrying in 5s"; sleep 5
          done
          ffmpeg -version | head -1
      - run: pip install -r requirements.txt
      - name: Run
        env:
          CMD: ${{ inputs.command }}
        run: mkdir -p output && bash -c "$CMD" && rm -f output/*.wav
      - name: Upload preview artifact (auto-expires in 2 days)
        uses: actions/upload-artifact@v4
        with:
          name: preview-renders
          path: output/*
          retention-days: 2
