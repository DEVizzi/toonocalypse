name: Preview

# Run an on-demand render command on Actions and upload output/* as an auto-expiring workflow artifact
# (never creates lingering GitHub Releases or git tags).
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        default: "python -m src.main --dry-run --stills 4 --out output/dry_run_s1_e1.mp4"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg (with retries)
        timeout-minutes: 12
        run: |
          if which ffmpeg && which ffprobe; then ffmpeg -version | head -1; exit 0; fi
          for i in 1 2 3; do
            timeout 300 bash -c "sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg" && break
            echo "apt attempt $i failed; retrying in 20s"; sleep 20
          done
          ffmpeg -version | head -1
      - run: pip install -r requirements.txt
      - name: Run
        env:
          CMD: ${{ inputs.command }}
        run: mkdir -p output && bash -c "$CMD" && rm -f output/*.wav
      - name: Upload preview artifact (auto-expires in 2 days)
        uses: actions/upload-artifact@v4
        with:
          name: preview-renders
          path: output/*
          retention-days: 2
