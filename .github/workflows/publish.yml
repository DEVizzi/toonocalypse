name: Publish Daily Episode

# Schedule is enabled only after the dry run is approved: 18:30 Asia/Kolkata = 13:00 UTC.
on:
  # schedule:
  #   - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Post oldest buffered episode to YouTube + Instagram
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m src.publish
      - name: Commit state
        if: always()
        run: |
          git config user.name "toonocalypse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/published.json state/buffer.json state/story_bible.json
          git diff --cached --quiet || git commit -m "chore(state): published episode"
          git pull --rebase -q && git push -q
