name: Build Reference Sheets

on:
  workflow_dispatch:
    inputs:
      offline:
        description: "Generate deterministic placeholder refs if GOOGLE_API_KEY is unset"
        type: boolean
        default: false

concurrency:
  group: build-refs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build scale chart and character reference sheets
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY1: ${{ secrets.GOOGLE_API_KEY1 }}
          GOOGLE_API_KEY2: ${{ secrets.GOOGLE_API_KEY2 }}
          GOOGLE_API_KEY3: ${{ secrets.GOOGLE_API_KEY3 }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS }}
        run: |
          OFFLINE_FLAG=""
          if [ "${{ inputs.offline }}" = "true" ] || [ -z "${GOOGLE_API_KEY}${GOOGLE_API_KEY1}${GOOGLE_API_KEY2}${GOOGLE_API_KEY3}${GOOGLE_API_KEYS}" ]; then
            OFFLINE_FLAG="--offline"
          fi
          python3 -m src.cli build-refs $OFFLINE_FLAG
      - name: Commit updated reference sheets
        run: |
          git config user.name "toonocalypse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/ characters/ state/quota.json
          git diff --cached --quiet || git commit -m "chore: update character reference sheets"
          git push
