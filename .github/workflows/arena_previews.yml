name: Arena Previews (v6)

on:
  push:
    branches: [v51-variety]
    paths: ["src/physics/**", "src/games/goals.py", "src/main.py", "config/settings.yaml", "src/narration/**", "src/audio/**", "src/games/arenas_v6/**", "src/rendering/arena_art/**", "src/games/arena_kit.py", ".github/workflows/arena_previews.yml"]
  workflow_dispatch:
    inputs:
      arenas:
        description: "Space-separated arena keys (default = all 23 v6 arenas)"
        default: ""

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      arenas: ${{ steps.mk.outputs.arenas }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: mk
        env:
          SDL_VIDEODRIVER: dummy
          REQ: ${{ inputs.arenas }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from src.games import arenas_v6  # noqa
          from src.games.arena_kit import INFO
          req = os.environ.get("REQ", "").split()
          keys = [k for k in (req or sorted(INFO)) if k in INFO]
          print("arenas=" + json.dumps(keys))
          EOF

  render:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        arena: ${{ fromJson(needs.list.outputs.arenas) }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg
        timeout-minutes: 4
        run: |
          if which ffmpeg; then exit 0; fi
          APT_OPTS="-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for i in 1 2 3; do sudo apt-get $APT_OPTS update -q && sudo apt-get $APT_OPTS install -y -q --no-install-recommends ffmpeg && break; sleep 5; done
      - run: pip install -r requirements.txt
      - name: Render final Short (audio, >=22 s remake rule) + stills
        env:
          ARENA: ${{ matrix.arena }}
        run: |
          mkdir -p output
          RACE=5
          case "$ARENA" in duel_dome) RACE=28;; triangle_throne) RACE=30;; esac
          python -m src.main --dry-run --season 1 --race $RACE --arena "$ARENA" --stills 6 \
            --out "output/${ARENA}.mp4" 2>&1 | tail -25
          python tests/arena_lab.py "$ARENA" -n 8 | tee "output/${ARENA}_lab.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: arena-${{ matrix.arena }}
          path: output/*
          retention-days: 7

  sheet:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: arts
          pattern: arena-*
      - name: One contact sheet + lab summary for all arenas
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python - <<'EOF'
          import glob, os, re, pygame
          pygame.init()
          dirs = sorted(glob.glob("arts/arena-*"))
          tiles, summary = [], []
          for d in dirs:
              key = d.split("arena-", 1)[1]
              pngs = sorted(p for p in glob.glob(f"{d}/*.png") if "still" in os.path.basename(p) or True)
              pngs = [p for p in pngs if not os.path.basename(p).startswith("verify")]
              lab = open(f"{d}/{key}_lab.txt").read() if os.path.exists(f"{d}/{key}_lab.txt") else "no lab"
              acc = re.findall(r"== \S+ / (\S+).*?\n\s+accepted (\d+)/(\d+).*?median len ([\d.]+)s", lab, re.S)
              summary.append(f"{key:18s} mp4={'yes' if glob.glob(d + '/*.mp4') else 'NO '} " +
                             " | ".join(f"{g} {a}/{n} {l}s" for g, a, n, l in acc))
              picks = [pngs[i] for i in (1, 3, 4) if i < len(pngs)] or pngs[:3]
              row = pygame.Surface((3 * 270, 480 + 34))
              row.fill((20, 20, 30))
              f = pygame.font.SysFont(None, 34)
              row.blit(f.render(key, True, (255, 230, 80)), (8, 4))
              for i, p in enumerate(picks):
                  im = pygame.image.load(p)
                  row.blit(pygame.transform.smoothscale(im, (270, 480)), (i * 270, 34))
              tiles.append(row)
          cols = 4
          rows = (len(tiles) + cols - 1) // cols
          sheet = pygame.Surface((cols * 810, rows * 514))
          for i, t in enumerate(tiles):
              sheet.blit(t, ((i % cols) * 810, (i // cols) * 514))
          os.makedirs("out", exist_ok=True)
          pygame.image.save(pygame.transform.smoothscale(sheet, (sheet.get_width() // 2, sheet.get_height() // 2)), "out/all_arenas.png")
          open("out/summary.txt", "w").write("\n".join(summary) + "\n")
          print("\n".join(summary))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: arena-sheet
          path: out/*
          retention-days: 3
