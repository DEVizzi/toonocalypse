name: Generate Episode Buffer

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "Optional format override (One-Shot, Mini-Arc, Epic-Arc)"
        required: false
        default: ""
      heroes:
        description: "Optional comma-separated hero slugs"
        required: false
        default: ""
      offline:
        description: "Run offline without API spend"
        type: boolean
        default: false
      draft:
        description: "Upload as draft release"
        type: boolean
        default: true
      force:
        description: "Generate even if paused or buffer >= 3"
        type: boolean
        default: false
      fail_preflight:
        description: "Deliberately fail preflight to verify clean abort"
        type: boolean
        default: false

concurrency:
  group: generate
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Generate buffered episode
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_API_VERSION: "v1beta"
          TOON_FORMAT: ${{ inputs.format }}
          TOON_HEROES: ${{ inputs.heroes }}
          TOON_OFFLINE: ${{ inputs.offline }}
          TOON_DRAFT: ${{ inputs.draft }}
          TOON_FORCE: ${{ inputs.force }}
          TOON_FAIL_PREFLIGHT: ${{ inputs.fail_preflight }}
        run: python3 -m src.cli generate
      - name: Commit state updates
        if: always()
        run: |
          git config user.name "toonocalypse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: update generation state"
          git push
