name: Build Art Library (Kaggle GPU)

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      fetch_existing:
        description: "Skip pushing and poll/download the latest Kaggle run"
        required: false
        default: false
        type: boolean

concurrency:
  group: art-library
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-art-library:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt kaggle six
      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          python3 -c 'import json,os; json.dump({"username":os.environ["KAGGLE_USERNAME"],"key":os.environ["KAGGLE_KEY"]}, open(os.path.expanduser("~/.kaggle/kaggle.json"),"w"))'
          chmod 600 ~/.kaggle/kaggle.json
      - name: Push Kaggle notebook and wait for completion
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          FETCH_EXISTING: ${{ inputs.fetch_existing || 'false' }}
        run: |
          if [ "$FETCH_EXISTING" != "true" ]; then
            kaggle kernels push -p kaggle
          fi
          COMPLETE=0
          for i in $(seq 1 115); do
            STATUS=$(kaggle kernels status "${KAGGLE_USERNAME}/toonocalypse-art-library" | tr '[:upper:]' '[:lower:]')
            echo "Poll $i: $STATUS"
            if echo "$STATUS" | grep -q "complete"; then COMPLETE=1; break; fi
            if echo "$STATUS" | grep -q "error\|cancel"; then exit 1; fi
            sleep 45
          done
          if [ "$COMPLETE" != "1" ]; then
            echo "Timed out waiting for Kaggle kernel completion"
            exit 1
          fi
          mkdir -p kaggle_out
          kaggle kernels output "${KAGGLE_USERNAME}/toonocalypse-art-library" -p kaggle_out
          ls -la kaggle_out
      - name: Publish art-library release and update index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m src.cli import-art-library --dir kaggle_out/art_output
          git config user.name "toonocalypse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/library_index.json state/art_queue.json
          git diff --cached --quiet || git commit -m "chore: update art library index from Kaggle GPU batch"
          git push
