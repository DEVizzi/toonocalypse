name: Kaggle Collect

# Advances the art state machine. Manual until the dry run is approved; then a */30 schedule is enabled (Phase 6).
on:
  workflow_dispatch:
    inputs:
      command:
        description: "start (push portraits for a SCRIPTED story) or collect"
        required: false
        default: "collect"

concurrency:
  group: kaggle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Quick exit when no story needs art
        id: gate
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          s = (json.load(open("state/story_bible.json")).get("current") or {}).get("status")
          print("go=" + ("true" if s in ("SCRIPTED", "ART_IN_PROGRESS") else "false"))
          EOF
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: "pip"
      - if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt "kaggle>=1.7"
      - name: Kaggle credentials (runner only)
        if: steps.gate.outputs.go == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          python3 -c 'import json,os; json.dump({"username":os.environ["KAGGLE_USERNAME"],"key":os.environ["KAGGLE_API_TOKEN"]}, open(os.path.expanduser("~/.kaggle/kaggle.json"),"w"))'
          chmod 600 ~/.kaggle/kaggle.json
      - name: Advance art state machine
        if: steps.gate.outputs.go == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          CMD: ${{ inputs.command || 'collect' }}
        run: python -m src.kaggle_jobs "$CMD"
      - name: Remove Kaggle credentials
        if: always()
        run: rm -rf ~/.kaggle
      - name: Commit state
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "toonocalypse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/story_bible.json state/quota.json
          git diff --cached --quiet || git commit -m "chore(state): art progress"
          git pull --rebase -q && git push -q
