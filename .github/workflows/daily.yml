name: Daily Episode (ToonToonCastle)

# v4.4 Autonomous 6-Month Production Pipeline (1 episode/day -> YouTube Shorts + Instagram Reels):
# - Scheduled cron `17 14 * * *` (14:17 UTC -> publishes around 8:00 PM IST daily).
# - Manual `workflow_dispatch` with `dry_run: true` (renders & validates `dry_run_s1_e1.mp4` without uploading or
#   mutating `state/`) or `dry_run: false` (live dual upload + atomic `state/*.json` commit).
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (render + ffprobe/zoom gates only; no uploads or state commit)"
        type: boolean
        default: true
      privacy:
        description: "YouTube Shorts privacy for live uploads"
        type: choice
        default: public
        options: [public, unlisted, private]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      PRIVACY: ${{ inputs.privacy || 'public' }}
      # LLM commentary punch-up (offline 115+ line comedy bank automatic fallback)
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # YouTube Data API v3 (supports both YOUTUBE_* and YT_* secret names)
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.YT_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN }}
      # Instagram Reels Graph API
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      # GitHub token for ephemeral IG staging release + failure Issue alerts + state push
      GH_PAT: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg (with apt mirror retries)
        timeout-minutes: 12
        run: |
          if which ffmpeg && which ffprobe; then ffmpeg -version | head -1; exit 0; fi
          for i in 1 2 3; do
            timeout 300 bash -c "sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg" && break
            echo "apt attempt $i failed; retrying in 20s"; sleep 20
          done
          ffmpeg -version | head -1 && ffprobe -version | head -1
      - run: pip install -r requirements.txt
      - name: Configure git identity
        run: |
          git config user.name "toontooncastle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pre-flight YouTube OAuth check
        if: env.DRY_RUN != 'true'
        continue-on-error: true
        run: python -m src.publish.oauth
      - name: Render, Validate Gates, Dual Publish (YT Shorts + IG Reels), & Commit State
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY-RUN MODE: rendering + validating without uploads or state mutation ==="
            python -m src.main --dry-run --stills 4 --out output/dry_run_s1_e1.mp4
            python -m src.publish.validate output/dry_run_s1_e1.mp4
            rm -f output/*.wav
          else
            echo "=== LIVE AUTONOMOUS MODE: YT Shorts + IG Reels + atomic state commit ==="
            python -m src.main --publish --privacy "$PRIVACY" --commit-state --out output/episode.mp4
            rm -rf output
          fi
      - name: Upload dry-run preview artifact (dry_run only; auto-expires in 2 days)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-preview
          path: |
            output/dry_run_s1_e1.mp4
            output/dry_run_s1_e1.json
            output/dry_run_s1_e1_f*.png
          retention-days: 2
      - name: Open GitHub Issue alert on pipeline failure
        if: failure() && env.DRY_RUN != 'true'
        run: |
          python -c 'from src.publish.alerts import open_alert_issue; open_alert_issue("[ToonToonCastle Alert] Daily Episode Workflow Failed", "The scheduled daily episode workflow exited non-zero. Inspect the linked Actions run logs.")'
