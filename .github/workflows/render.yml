name: Render Story

# Triggered by kaggle_collect when a story reaches READY_TO_RENDER (or manually).
on:
  workflow_dispatch:

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - name: Python deps (CPU torch for Kokoro)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt -r requirements-render.txt
      - uses: actions/cache@v4
        with:
          path: |
            work/tts_cache
            ~/.cache/huggingface
          key: tts-${{ github.run_id }}
          restore-keys: tts-
      - name: Render all parts + QA + buffer
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.render
      - name: Commit state
        if: always()
        run: |
          git config user.name "toonocalypse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/story_bible.json state/buffer.json state/quota.json
          git diff --cached --quiet || git commit -m "chore(state): story rendered + buffered"
          git pull --rebase -q && git push -q
